<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hilltoppers Prep — Today's Plan</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- Iframe critical block: sizes the icons and lays out the day row even if
         the stylesheet is slow, blocked, or overridden by the host popup. Kept
         short on purpose — style.css is still the full theme and loads after
         this, so it wins on conflicts. Inline SVGs also carry explicit
         width/height attributes, because an unsized <svg viewBox> renders at its
         300x150 default and looks enormous in a 318px iframe. -->
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        margin: 0;
        overflow-x: hidden;
      }

      body {
        background: #f4f7f2;
        color: #1e2620;
        font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }

      [data-topping-content] {
        max-width: 100%;
        min-width: 0;
        overflow-x: hidden;
      }

      .top-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .gear-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }

      .gear-icon {
        width: 16px;
        height: 16px;
        flex: 0 0 auto;
      }

      .day-nav {
        display: flex;
        align-items: center;
        gap: 4px;
        min-width: 0;
      }

      .day-current {
        min-width: 0;
        text-align: center;
      }

      .day-name,
      .day-date {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .day-arrow {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 20px;
        height: 20px;
        padding: 0;
        border: 0;
        background: none;
        flex: 0 0 auto;
      }

      .day-arrow svg {
        width: 14px;
        height: 14px;
      }
    </style>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div data-topping-content id="topping-content">
      <header class="top-header">
        <h1>Today's Plan</h1>
        <nav id="day-nav" class="day-nav" aria-label="Change the day shown">
          <button id="day-prev" class="day-arrow" type="button" aria-label="Previous day">
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" focusable="false">
              <path d="M17 4 L7 12 L17 20 Z" fill="currentColor" />
            </svg>
          </button>
          <div class="day-current">
            <span id="day-name" class="day-name">Today</span>
            <span id="day-date" class="day-date"></span>
          </div>
          <button id="day-next" class="day-arrow" type="button" aria-label="Next day">
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" focusable="false">
              <path d="M7 4 L17 12 L7 20 Z" fill="currentColor" />
            </svg>
          </button>
        </nav>
        <button
          id="settings-toggle"
          class="ghost-btn gear-btn"
          type="button"
          aria-expanded="false"
          aria-controls="settings"
          aria-label="Settings"
        >
          <!-- Settings glyph: Phosphor "gear" (regular weight), MIT licensed
               (https://phosphoricons.com), inlined so the topping keeps zero
               runtime dependencies. -->
          <svg
            class="gear-icon"
            viewBox="0 0 256 256"
            width="16"
            height="16"
            fill="currentColor"
            aria-hidden="true"
            focusable="false"
          >
            <path d="M128,80a48,48,0,1,0,48,48A48.05,48.05,0,0,0,128,80Zm0,80a32,32,0,1,1,32-32A32,32,0,0,1,128,160Zm88-29.84q.06-2.16,0-4.32l14.92-18.64a8,8,0,0,0,1.48-7.06,107.21,107.21,0,0,0-10.88-26.25,8,8,0,0,0-6-3.93l-23.72-2.64q-1.48-1.56-3-3L186,40.54a8,8,0,0,0-3.94-6,107.71,107.71,0,0,0-26.25-10.87,8,8,0,0,0-7.06,1.49L130.16,40Q128,40,125.84,40L107.2,25.11a8,8,0,0,0-7.06-1.48A107.6,107.6,0,0,0,73.89,34.51a8,8,0,0,0-3.93,6L67.32,64.27q-1.56,1.49-3,3L40.54,70a8,8,0,0,0-6,3.94,107.71,107.71,0,0,0-10.87,26.25,8,8,0,0,0,1.49,7.06L40,125.84Q40,128,40,130.16L25.11,148.8a8,8,0,0,0-1.48,7.06,107.21,107.21,0,0,0,10.88,26.25,8,8,0,0,0,6,3.93l23.72,2.64q1.49,1.56,3,3L70,215.46a8,8,0,0,0,3.94,6,107.71,107.71,0,0,0,26.25,10.87,8,8,0,0,0,7.06-1.49L125.84,216q2.16.06,4.32,0l18.64,14.92a8,8,0,0,0,7.06,1.48,107.21,107.21,0,0,0,26.25-10.88,8,8,0,0,0,3.93-6l2.64-23.72q1.56-1.48,3-3L215.46,186a8,8,0,0,0,6-3.94,107.71,107.71,0,0,0,10.87-26.25,8,8,0,0,0-1.49-7.06Zm-16.1-6.5a73.93,73.93,0,0,1,0,8.68,8,8,0,0,0,1.74,5.48l14.19,17.73a91.57,91.57,0,0,1-6.23,15L187,173.11a8,8,0,0,0-5.1,2.64,74.11,74.11,0,0,1-6.14,6.14,8,8,0,0,0-2.64,5.1l-2.51,22.58a91.32,91.32,0,0,1-15,6.23l-17.74-14.19a8,8,0,0,0-5-1.75h-.48a73.93,73.93,0,0,1-8.68,0,8,8,0,0,0-5.48,1.74L100.45,215.8a91.57,91.57,0,0,1-15-6.23L82.89,187a8,8,0,0,0-2.64-5.1,74.11,74.11,0,0,1-6.14-6.14,8,8,0,0,0-5.1-2.64L46.43,170.6a91.32,91.32,0,0,1-6.23-15l14.19-17.74a8,8,0,0,0,1.74-5.48,73.93,73.93,0,0,1,0-8.68,8,8,0,0,0-1.74-5.48L40.2,100.45a91.57,91.57,0,0,1,6.23-15L69,82.89a8,8,0,0,0,5.1-2.64,74.11,74.11,0,0,1,6.14-6.14A8,8,0,0,0,82.89,69L85.4,46.43a91.32,91.32,0,0,1,15-6.23l17.74,14.19a8,8,0,0,0,5.48,1.74,73.93,73.93,0,0,1,8.68,0,8,8,0,0,0,5.48-1.74L155.55,40.2a91.57,91.57,0,0,1,15,6.23L173.11,69a8,8,0,0,0,2.64,5.1,74.11,74.11,0,0,1,6.14,6.14,8,8,0,0,0,5.1,2.64l22.58,2.51a91.32,91.32,0,0,1,6.23,15l-14.19,17.74A8,8,0,0,0,199.87,123.66Z" />
          </svg>
          <span class="settings-label">Settings</span>
        </button>
      </header>

      <section id="settings" class="settings" aria-label="Canvas settings" hidden>
        <label for="canvas-token">Canvas API token</label>
        <input
          id="canvas-token"
          name="canvas-token"
          type="password"
          autocomplete="off"
          spellcheck="false"
          placeholder="Paste your Canvas access token"
        />

        <div class="settings-actions">
          <button id="save-settings" class="primary-btn" type="button">Save &amp; refresh</button>
          <span id="settings-status" class="settings-status" role="status" aria-live="polite"></span>
        </div>
      </section>

      <main id="classes" class="classes">
        <p class="hint">Add your Canvas API token in Settings (the gear) to load the plan for each class.</p>
      </main>
    </div>

    <script src="script.js" defer></script>
    <script src="resize.js" defer></script>
  </body>
</html>
