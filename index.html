<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hilltoppers Prep — Today's Plan</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <!-- Iframe critical block: sizes the icons and lays out the day row even if
         the stylesheet is slow, blocked, or overridden by the host popup. Kept
         short on purpose — style.css is still the full theme and loads after
         this, so it wins on conflicts. Inline SVGs also carry explicit
         width/height attributes, because an unsized <svg viewBox> renders at its
         300x150 default and looks enormous in a 318px iframe. -->
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        margin: 0;
        overflow-x: hidden;
      }

      body {
        background: #f4f7f2;
        color: #1e2620;
        font: 13px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }

      [data-topping-content] {
        max-width: 100%;
        min-width: 0;
        overflow-x: hidden;
      }

      .top-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .gear-btn {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }

      .gear-icon {
        width: 16px;
        height: 16px;
        flex: 0 0 auto;
      }

      .day-nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        min-width: 0;
      }

      .day-current {
        min-width: 0;
        text-align: center;
      }

      .day-name,
      .day-date {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .day-arrow {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 26px;
        flex: 0 0 auto;
      }

      .day-arrow svg {
        width: 18px;
        height: 18px;
      }
    </style>

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div data-topping-content id="topping-content">
      <header class="top-header">
        <h1>Today's Plan</h1>
        <button
          id="settings-toggle"
          class="ghost-btn gear-btn"
          type="button"
          aria-expanded="true"
          aria-controls="settings"
          aria-label="Settings"
        >
          <svg
            class="gear-icon"
            viewBox="0 0 24 24"
            width="16"
            height="16"
            fill="currentColor"
            aria-hidden="true"
            focusable="false"
          >
            <path
              fill-rule="evenodd"
              d="M10.7 2h2.6l.4 2.3c.6.2 1.1.4 1.6.7l2-1.2 1.8 1.8-1.2 2c.3.5.5 1 .7 1.6l2.3.4v2.6l-2.3.4c-.2.6-.4 1.1-.7 1.6l1.2 2-1.8 1.8-2-1.2c-.5.3-1 .5-1.6.7l-.4 2.3h-2.6l-.4-2.3a6.9 6.9 0 0 1-1.6-.7l-2 1.2-1.8-1.8 1.2-2a6.9 6.9 0 0 1-.7-1.6L2 13.3v-2.6l2.3-.4c.2-.6.4-1.1.7-1.6l-1.2-2 1.8-1.8 2 1.2c.5-.3 1-.5 1.6-.7L10.7 2Zm1.3 6.9a3.1 3.1 0 1 0 0 6.2 3.1 3.1 0 0 0 0-6.2Z"
            />
          </svg>
          <span class="settings-label">Settings</span>
        </button>
      </header>

      <nav id="day-nav" class="day-nav" aria-label="Change the day shown">
        <button id="day-prev" class="day-arrow" type="button" aria-label="Previous day">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
            <path
              d="M14.5 5.5 8 12l6.5 6.5"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
        <div class="day-current">
          <span id="day-name" class="day-name">Today</span>
          <span id="day-date" class="day-date"></span>
        </div>
        <button id="day-next" class="day-arrow" type="button" aria-label="Next day">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
            <path
              d="M9.5 5.5 16 12l-6.5 6.5"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </nav>

      <section id="settings" class="settings" aria-label="Canvas settings">
        <label for="canvas-token">Canvas API token</label>
        <input
          id="canvas-token"
          name="canvas-token"
          type="password"
          autocomplete="off"
          spellcheck="false"
          placeholder="Paste your Canvas access token"
        />

        <div class="settings-actions">
          <button id="save-settings" class="primary-btn" type="button">Save &amp; refresh</button>
          <span id="settings-status" class="settings-status" role="status" aria-live="polite"></span>
        </div>
      </section>

      <main id="classes" class="classes">
        <p class="hint">Add your Canvas API token above to load the plan for each class.</p>
      </main>
    </div>

    <script src="script.js" defer></script>
    <script src="resize.js" defer></script>
  </body>
</html>
